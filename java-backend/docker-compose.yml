version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: parking-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: parking_db
      POSTGRES_USER: ${DB_USER:-parking}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-parking123}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - parking-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-parking} -d parking_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parking-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/parking_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-parking}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-parking123}
      JWT_SECRET: ${JWT_SECRET:-defaultDevSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-2QRY7YW8}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-GETJDYUXQLNYMXRZZDTVWJKEYXOTXTMI}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/v3/api-docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  parking-pgdata:
