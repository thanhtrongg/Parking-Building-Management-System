spring:
  datasource:
    url: jdbc:h2:mem:parking_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  jwt:
    secret: defaultTestSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm
  vnpay:
    tmn-code: 2QRY7YW8
    hash-secret: GETJDYUXQLNYMXRZZDTVWJKEYXOTXTMI
